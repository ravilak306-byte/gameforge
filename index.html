<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="s0h-komVBU6j0aspEu8pg1bReURPac6H2TldzWpUiag" />
    <title>EpicForge - Download PC Games & Movies</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050505; color: #e0e0e0; }
        
        /* Navigation & Tabs */
        header { padding: 20px; text-align: center; background-color: #111; border-bottom: 2px solid #00a8ff; }
        .tabs { margin-top: 15px; }
        .tab-btn { background: #222; color: white; border: none; padding: 10px 30px; font-size: 16px; cursor: pointer; border-radius: 5px; margin: 0 5px; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: #00a8ff; color: #000; font-weight: bold; }

        /* Grid */
        .container { padding: 30px; display: none; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .container.active { display: flex; }
        .card { background: #151515; border: 1px solid #333; border-radius: 10px; width: 250px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #00a8ff; }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .card h3 { padding: 15px; font-size: 18px; text-align: center; color: #fff; }

        /* Modal / Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 10px; width: 80%; max-width: 800px; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid #00a8ff; }
        .close-btn { position: absolute; top: 15px; right: 20px; color: #ff4757; font-size: 30px; cursor: pointer; }
        .modal-title { color: #00a8ff; margin-bottom: 15px; }
        .modal-images { display: flex; gap: 10px; overflow-x: auto; margin: 15px 0; }
        .modal-images img { width: 200px; border-radius: 5px; }
        .download-btn { display: inline-block; background: #00a8ff; color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 15px; }

        /* Welcome Message */
        .welcome-msg { display: none; position: fixed; top: 20px; right: 20px; background: #00a8ff; color: #000; padding: 15px 25px; border-radius: 5px; font-weight: bold; z-index: 2000; box-shadow: 0 0 10px rgba(0,168,255,0.5); animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- Welcome Message Popup -->
    <div id="welcomeAlert" class="welcome-msg">
        🎉 Welcome to EpicForge! Free Games & Movies!
    </div>

    <header>
        <h1>EpicForge</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('games')">PC Games</button>
            <button class="tab-btn" onclick="switchTab('movies')">Movies</button>
        </div>
    </header>

    <!-- Games Section -->
    <div id="games-section" class="container active"></div>

    <!-- Movies Section -->
    <div id="movies-section" class="container"></div>

    <!-- Details Modal (Common for both) -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" class="modal-title">Title</h2>
            <p id="modal-desc" style="margin-bottom:15px;"></p>
            <h4 id="info-title" style="color:#00a8ff;">System Requirements:</h4>
            <ul id="modal-info" style="margin:10px 0 15px 20px; color:#ccc;"></ul>
            <div id="modal-images" class="modal-images"></div>
            <a id="modal-download" href="#" class="download-btn">Download Now</a>
        </div>
    </div>

    <script>
        // Show Welcome Message once per session
        window.onload = function() {
            if(!sessionStorage.getItem('welcomed')) {
                let alertBox = document.getElementById('welcomeAlert');
                alertBox.style.display = 'block';
                setTimeout(() => { alertBox.style.display = 'none'; }, 4000); // Hides after 4 seconds
                sessionStorage.setItem('welcomed', 'true');
            }
            fetchData();
        };

        // Tab Switching Logic
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.container').forEach(sec => sec.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-section').classList.add('active');
        }

        // Fetch Data from games.json
        function fetchData() {
            fetch('games.json')
                .then(res => res.json())
                .then(data => {
                    renderItems(data.games_list || [], 'games-section', 'game');
                    renderItems(data.movies_list || [], 'movies-section', 'movie');
                })
                .catch(err => console.log('Error loading data:', err));
        }

        // Render Cards
        function renderItems(items, containerId, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                let infoData = type === 'game' ? item.req : item.actors;
                let galleryLinks = "";
                if(item.gallery) {
                    galleryLinks = item.gallery.map(g => g.img ? g.img : g).join(',');
                }

                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.thumbnail}" alt="${item.title}">
                    <h3>${item.title}</h3>
                `;
                // Click Event to open Modal
                card.onclick = () => openModal(item.title, item.description, infoData, galleryLinks, item.torrent, type);
                container.appendChild(card);
            });
        }

        // Open Modal
        function openModal(title, desc, info, images, torrent, type) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            
            // Change title based on Game or Movie
            document.getElementById('info-title').innerText = type === 'game' ? "System Requirements:" : "Main Actors:";
            
            let infoList = document.getElementById('modal-info');
            infoList.innerHTML = '';
            if(info) {
                info.split('|').forEach(line => {
                    let li = document.createElement('li');
                    li.innerText = line.trim();
                    infoList.appendChild(li);
                });
            }

            let gallery = document.getElementById('modal-images');
            gallery.innerHTML = '';
            if(images) {
                images.split(',').forEach(imgSrc => {
                    if(imgSrc.trim() !== '') {
                        let img = document.createElement('img');
                        img.src = imgSrc.trim();
                        gallery.appendChild(img);
                    }
                });
            }

            document.getElementById('modal-download').href = torrent;
            document.getElementById('details-modal').style.display = 'flex';
        }

        // Close Modal
        function closeModal() {
            document.getElementById('details-modal').style.display = 'none';
        }
    </script>
</body>
</html>
