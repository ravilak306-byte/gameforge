<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameForge - Download PC Games</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- CSS ඩිසයින් ටික මෙතනම තියෙනවා -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #e0e0e0;
        }

        header {
            background: linear-gradient(90deg, #000428 0%, #004e92 100%);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00a8ff;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .site-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 5px;
        }

        header h1 {
            color: #ffffff;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-section {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav .tab {
            color: #a9d6e5;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.3s ease;
        }

        nav .tab::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #00a8ff;
            transition: width 0.3s ease;
        }

        nav .tab:hover, nav .tab.active {
            color: #ffffff;
        }

        nav .tab:hover::after, nav .tab.active::after {
            width: 100%;
        }

        #searchBar {
            padding: 8px 15px;
            border: 1px solid #00a8ff;
            border-radius: 20px;
            background-color: #121212;
            color: #fff;
            outline: none;
            transition: 0.3s;
            width: 200px;
        }

        #searchBar:focus {
            width: 250px;
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.5);
            background-color: #1a1a1a;
        }

        .container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container h2 {
            margin-bottom: 20px;
            color: #00a8ff;
            border-left: 4px solid #00a8ff;
            padding-left: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background-color: #121212;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #1a1a1a;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #004e92;
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .game-info {
            padding: 20px;
        }

        .game-info h3 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        .game-info p {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 15px;
        }

        /* Modal Popup Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #0d0d0d;
            margin: 5% auto;
            padding: 30px;
            border: 1px solid #00a8ff;
            border-radius: 12px;
            width: 85%;
            max-width: 900px;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 168, 255, 0.4);
            animation: popupAnim 0.3s ease-out;
        }

        @keyframes popupAnim {
            from {opacity: 0; transform: translateY(-30px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .close-btn {
            color: #ff3333;
            float: right;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover {
            color: #ff6666;
            transform: scale(1.1);
        }

        .modal-content h2 {
            color: #ffffff;
            border-bottom: 2px solid #004e92;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .modal-info h3, .modal-gallery h3 {
            color: #00a8ff;
            margin-bottom: 10px;
        }

        .modal-info p {
            color: #cccccc;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-info ul {
            color: #cccccc;
            list-style-type: square;
            margin-left: 20px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .gallery-images {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .gallery-images img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #1a1a1a;
        }

        .download-btn {
            display: inline-block;
            background-color: #004e92;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
        }

        .download-btn:hover {
            background-color: #00a8ff;
        }

        @media (max-width: 768px) {
            .modal-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                width: 95%;
                margin: 10% auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <img src="logo.png" alt="Logo" class="site-logo"> 
            <h1>GameForge</h1>
        </div>
        
        <div class="nav-section">
            <nav>
                <a href="#" class="tab active">All</a>
                <a href="#" class="tab">Action</a>
                <a href="#" class="tab">RPG</a>
                <a href="#" class="tab">Racing</a>
                <a href="#" class="tab">Horror</a>
            </nav>
            <input type="text" id="searchBar" placeholder="Search games...">
        </div>
    </header>

    <div class="container">
        <h2>Latest Games</h2>
        <div class="games-grid" id="games-container">
            
            <div class="game-card" data-category="action" 
                 data-title="Grand Theft Auto V" 
                 data-desc="Explore the award-winning world of Los Santos and Blaine County in the ultimate open-world experience." 
                 data-req="OS: Windows 10 64 Bit | CPU: Intel Core i5 3470 | RAM: 8GB | GPU: NVIDIA GTX 660 2GB"
                 data-images="https://via.placeholder.com/400x200/001f3f/00a8ff?text=Gameplay+1,https://via.placeholder.com/400x200/001f3f/00a8ff?text=Gameplay+2"
                 data-torrent="#">
                <img src="https://via.placeholder.com/300x150/001f3f/00a8ff?text=GTA+V" alt="GTA V">
                <div class="game-info">
                    <h3>GTA V</h3>
                    <p>Open world action-adventure game.</p>
                </div>
            </div>

            <div class="game-card" data-category="horror"
                 data-title="Dying Light" 
                 data-desc="A first-person action survival game set in a post-apocalyptic open world overrun by flesh-hungry zombies." 
                 data-req="OS: Windows 10 | CPU: Intel Core i5-2500 | RAM: 4GB | GPU: NVIDIA GeForce GTX 560"
                 data-images="https://via.placeholder.com/400x200/001f3f/00a8ff?text=Zombie+Kill,https://via.placeholder.com/400x200/001f3f/00a8ff?text=Parkour"
                 data-torrent="#">
                <img src="https://via.placeholder.com/300x150/001f3f/00a8ff?text=Dying+Light" alt="Dying Light">
                <div class="game-info">
                    <h3>Dying Light</h3>
                    <p>Survival horror zombie game.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Popup Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Game Title</h2>
            
            <div class="modal-grid">
                <div class="modal-info">
                    <h3>Description</h3>
                    <p id="modal-desc">Description goes here...</p>
                    
                    <h3>System Requirements</h3>
                    <ul id="modal-req"></ul>
                    
                    <a href="#" id="modal-download" class="download-btn">Download Torrent</a>
                </div>
                
                <div class="modal-gallery">
                    <h3>In-Game Screenshots</h3>
                    <div id="modal-images" class="gallery-images"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS කෝඩ් ටික මෙතනම තියෙනවා -->
    <script>
        document.getElementById('searchBar').addEventListener('keyup', function(e) {
            let searchQuery = e.target.value.toLowerCase();
            let gameCards = document.querySelectorAll('.game-card');
            
            gameCards.forEach(card => {
                let gameTitle = card.querySelector('h3').innerText.toLowerCase();
                if(gameTitle.includes(searchQuery)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        });

        const modal = document.getElementById("gameModal");
        const closeBtn = document.querySelector(".close-btn");
        const gameCards = document.querySelectorAll(".game-card");

        gameCards.forEach(card => {
            card.addEventListener("click", function() {
                const title = this.getAttribute("data-title");
                const desc = this.getAttribute("data-desc");
                const req = this.getAttribute("data-req");
                const images = this.getAttribute("data-images").split(",");
                const torrent = this.getAttribute("data-torrent");

                document.getElementById("modal-title").innerText = title;
                document.getElementById("modal-desc").innerText = desc;
                document.getElementById("modal-download").href = torrent;

                const reqList = document.getElementById("modal-req");
                reqList.innerHTML = ""; 
                req.split("|").forEach(item => {
                    let li = document.createElement("li");
                    li.innerText = item.trim();
                    reqList.appendChild(li);
                });

                const gallery = document.getElementById("modal-images");
                gallery.innerHTML = ""; 
                images.forEach(imgSrc => {
                    let img = document.createElement("img");
                    img.src = imgSrc.trim();
                    gallery.appendChild(img);
                });

                modal.style.display = "block";
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
